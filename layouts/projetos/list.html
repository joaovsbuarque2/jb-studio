{{ define "main" }}
<main>
  <div class="bg-gradient-to-br from-primary-600 via-primary-700 to-secondary-800">
    <div class="px-4 py-20 mx-auto max-w-5xl sm:px-6 lg:py-28">
      <div class="max-w-3xl mx-auto text-center">
        <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl">
          {{ .Title }}
        </h1>
        {{ with .Content }}
        <div class="mt-4 text-lg text-white/80">
          {{ . }}
        </div>
        {{ end }}
      </div>
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-16">
    <div class="grid gap-8 lg:grid-cols-2">
      {{ range .Pages.ByTitle }}
      <a href="{{ .RelPermalink }}" class="group block">
        <div class="flex flex-col bg-white rounded-2xl shadow-lg dark:bg-gray-900 border border-gray-200 dark:border-gray-800 transition-all duration-300 group-hover:shadow-xl group-hover:-translate-y-1">
          <div class="flex-1 p-8 flex flex-col">
            <div class="flex items-start gap-3 mb-4">
              <h2 class="text-2xl font-bold text-gray-900 dark:text-white group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors">
                {{ .Title }}
              </h2>
              {{ with .Params.status }}
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium whitespace-nowrap
                {{ if eq $.Params.status_color "green" }}
                  bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200
                {{ else if eq $.Params.status_color "yellow" }}
                  bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200
                {{ else }}
                  bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200
                {{ end }}">
                {{ . }}
              </span>
              {{ end }}
            </div>
            <p class="text-gray-600 dark:text-gray-300 mb-6 leading-relaxed">
              {{ .Description }}
            </p>
            <div class="flex flex-wrap gap-2">
              {{ range first 4 .Params.tags }}
              <span class="inline-flex items-center px-3 py-1 rounded-md text-sm font-medium bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-200">
                {{ . }}
              </span>
              {{ end }}
            </div>
          </div>
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
