{{define "main"}}
<article>
  <header class="relative overflow-hidden bg-gradient-to-br from-primary-600 via-primary-700 to-secondary-800">
    <div class="relative px-4 py-20 mx-auto max-w-5xl sm:px-6 lg:py-28">
      <div class="max-w-3xl mx-auto text-center">
        <div class="flex flex-wrap gap-3 mb-4 justify-center">
          {{ range .Params.tags }}
          <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-white/20 text-white">
            {{ . }}
          </span>
          {{ end }}
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl">
          {{ .Title }}
        </h1>
        {{ with .Params.description }}
        <p class="mt-4 max-w-2xl mx-auto text-lg text-white/80">
          {{ . }}
        </p>
        {{ end }}
        {{ with .Params.status }}
        <div class="mt-6">
          <span class="inline-flex items-center px-4 py-1.5 rounded-full text-sm font-semibold
            {{ if eq $.Params.status_color "green" }}
              bg-green-500 text-white
            {{ else if eq $.Params.status_color "yellow" }}
              bg-yellow-500 text-white
            {{ else }}
              bg-blue-500 text-white
            {{ end }}">
            {{ . }}
          </span>
        </div>
        {{ end }}
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-12">
    <div class="prose prose-lg max-w-none dark:text-gray-300 prose-headings:text-gray-900 dark:prose-headings:text-white prose-a:text-primary-600 dark:prose-a:text-primary-400 prose-code:text-primary-600 dark:prose-code:text-primary-400 prose-code:bg-gray-100 dark:prose-code:bg-gray-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:text-sm prose-pre:bg-gray-900 dark:prose-pre:bg-gray-800 prose-table:border-collapse prose-table:border prose-table:border-gray-300 dark:prose-table:border-gray-700 prose-th:bg-gray-100 dark:prose-th:bg-gray-800 prose-th:px-4 prose-th:py-2 prose-td:px-4 prose-td:py-2">
      {{ .Content }}
    </div>
  </div>

  <div class="bg-gray-100 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800">
    <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-12 text-center">
      <a href="/jb-studio/projetos/" class="inline-flex items-center text-primary-600 dark:text-primary-400 font-semibold hover:underline text-lg">
        <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Ver todos os projetos
      </a>
    </div>
  </div>
</article>
{{end}}
